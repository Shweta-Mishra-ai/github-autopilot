# .github/workflows/evals.yml
# AI-output quality evals — the gate that catches the bot getting *worse* at
# reviewing code, which no unit test can see.
#
# Runs nightly rather than per-PR: each run spends real provider quota, so
# per-PR would be expensive and rate-limited, while manual-only meant it
# effectively never ran and prompt/provider regressions shipped unnoticed.
# Still manually triggerable for a one-off check before a prompt change.
#
# Requires the GROQ_API_KEY repository secret. See evals/README.md.

name: Evals

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose — scheduled runs bunched on the
    # hour queue behind the rest of GitHub's cron load.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Which eval set"
        type: choice
        options: [all, fix, review]
        default: all
      min_pass_rate:
        description: "Fail below this pass rate"
        default: "0.7"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    name: AI output evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # only used to report a scheduled regression
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: evals-pip-${{ hashFiles('requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check provider key is configured
        id: preflight
        # Without this the run exits 2 ("unrunnable") and reads as a pass to a
        # skim of the Actions tab. Fail loudly instead — a silently-unrun
        # quality gate is worse than none.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "unconfigured=true" >> "$GITHUB_OUTPUT"
            echo "::error::GROQ_API_KEY secret is not set — evals cannot run."
            echo "::error::Set it at Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "unconfigured=false" >> "$GITHUB_OUTPUT"

      - name: Run evals
        id: run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_APP_ID: "99999"
          GITHUB_PRIVATE_KEY: ""
          GITHUB_WEBHOOK_SECRET: "eval-run-secret-32chars-long-abc!"
          MCP_API_KEY: "eval-run-mcp-key"
          LOG_FORMAT: "text"
          # inputs.* are empty on a schedule trigger — fall back to the same
          # defaults the workflow_dispatch form shows.
          TASK: ${{ inputs.task || 'all' }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.7' }}
        run: |
          set -o pipefail
          # Exit 3 means the configured model no longer exists at the provider.
          # That is an infrastructure failure, not a quality one, and the two
          # send a maintainer to opposite ends of the codebase — so record which
          # it was rather than letting the report guess.
          set +e
          python -m evals.run --task "$TASK" --min-pass-rate "$MIN_PASS_RATE" \
            | tee eval-output.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summarise on the run page
        if: always()
        run: |
          {
            echo "## AI output evals"
            echo ""
            echo "Task: \`${{ inputs.task || 'all' }}\` · "
            echo "Min pass rate: \`${{ inputs.min_pass_rate || '0.7' }}\`"
            echo ""
            echo '```'
            tail -n 40 eval-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: eval-output.txt
          if-no-files-found: ignore

      - name: Report a nightly regression
        # Only on the scheduled run: a manual run is already being watched by
        # whoever clicked it. Reuses one open issue so a week of failures does
        # not create seven.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Two very different failures reach this step, and saying the wrong
          # one costs real time: "quality regressed" sends a maintainer to read
          # prompts and diff model versions, when the actual fix is one
          # repository secret. Report what actually happened.
          if [ "${{ steps.run.outputs.exit_code }}" = "4" ]; then
            TITLE="Nightly AI evals could not measure — the provider throttled the run"
            BODY=$(printf '%s\n' \
              "The suite did not produce a quality result. It is NOT a regression:" \
              "the provider rate-limited some cases, so they were never scored." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "The run log names the blocked cases. The suite runs cases back to" \
              "back and a larger model has a smaller allowance, so the usual fix is" \
              "to raise \`EVAL_CASE_DELAY_SECONDS\` in the workflow." \
              "" \
              "Cases that DID get an answer were scored normally and are in the" \
              "summary; the pass-rate is withheld because averaging unscored cases" \
              "into it would report a provider limit as a drop in review quality." )
          elif [ "${{ steps.run.outputs.exit_code }}" = "3" ]; then
            TITLE="Nightly AI evals cannot run — the configured model no longer exists"
            BODY=$(printf '%s\n' \
              "The eval suite did not measure anything. It is NOT a quality regression:" \
              "the provider returned 404 for the model this deployment asks for, so every" \
              "request failed and every case scored zero on empty output." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "**The live bot is failing the same way.** Every AI command -- /fix," \
              "/explain, /review and the rest -- calls the same model id, so they are" \
              "all returning provider errors right now, not just this suite." \
              "" \
              "Fix: set \`LLM_PRIMARY_MODEL\` and \`LLM_FALLBACK_MODEL\` to ids the" \
              "provider still serves. The run log lists what is currently available." )
          elif [ "${{ steps.preflight.outputs.unconfigured }}" = "true" ]; then
            TITLE="Nightly AI evals cannot run — GROQ_API_KEY is not set"
            BODY=$(printf '%s\n' \
              "The nightly eval suite did not run. It is not a quality regression:" \
              "the \`GROQ_API_KEY\` repository secret is missing, so the suite had no" \
              "provider to call." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "Fix: Settings > Secrets and variables > Actions > New repository secret," \
              "named \`GROQ_API_KEY\`." \
              "" \
              "Until then this is the only quality gate in CI that is not running —" \
              "everything else checks that the code is correct, and only this checks" \
              "that the bot is still good at reviewing code." )
          else
            TITLE="Nightly AI evals are failing"
            BODY=$(printf '%s\n' \
              "The nightly AI-output eval suite fell below its pass-rate threshold." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "This measures whether the bot still finds the planted bugs in" \
              "\`evals/cases/\` — a drop usually means a prompt, model, or provider" \
              "change degraded review quality." )
          fi
          # Find the existing report by TITLE, not by label.
          #
          # This filtered on `--label evals`, and that label had never been
          # created -- `gh issue create --label evals` fails with "not found"
          # and falls back to the unlabelled create, so no issue ever carried
          # it. A filter on a label nothing has matches nothing, so EXISTING
          # was always empty and every night opened a NEW issue: #86, #88, #89
          # and #90 in four nights, which is precisely what reusing one issue
          # was written to prevent.
          #
          # Titles are ours and all three start with the same words, so this
          # needs no search index and no label to keep working.
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("Nightly AI evals"))]
                  | .[0].number // empty' 2>/dev/null || echo "")

          # Created best-effort so the reports are filterable in the UI. The
          # lookup above deliberately does NOT depend on this succeeding.
          gh label create evals --color B60205 \
            --description "Nightly AI output eval failures" >/dev/null 2>&1 || true

          if [ -n "$EXISTING" ]; then
            # Retitle as well: the cause can change between nights, and an
            # issue that still says "are failing" when the run now fails for a
            # missing model sends the reader to the wrong place.
            gh issue edit "$EXISTING" --title "$TITLE" >/dev/null 2>&1 || true
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label evals \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
