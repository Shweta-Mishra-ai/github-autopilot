# .ai-repo-manager.yml
# GitHub Autopilot — Repo-level configuration
# Place this file in your repo root to customize bot behavior.
# All settings are optional — safe defaults used if missing.
# Docs: https://github.com/Shweta-Mishra-ai/github-autopilot

bot:
  enabled: true
  footer: "\n\n---\n*🤖 GitHub Autopilot — AI-powered repo management*"

pull_requests:
  enabled: true
  auto_polish_title: true
  auto_fill_description: true
  code_review: true
  detect_test_gaps: true
  max_files_reviewed: 4

issues:
  enabled: true
  auto_triage: true
  auto_label: true

push:
  enabled: true
  enforce_conventional_commits: true
  # Bot comments a rewritten Conventional Commits message on badly-named
  # commits, derived from the files they changed. Set false to keep the
  # lint report without comments on your commit history.
  suggest_commit_messages: true
  # Refresh generated README blocks (see "Managed README sections" in the
  # README) and open a PR when they drift out of date.
  update_readme: true
  create_issue_threshold: 3
  scan_secrets: true
  scan_dependencies: true

auto_merge:
  enabled: false
  require_passing_checks: true
  require_no_blocking_reviews: true
  allow_protected_branches: false
  allowed_risk_levels:
    - low

# NOTE: there is deliberately no `ai:` section.
#
# It used to carry primary_model, fallback_model, max_tokens, temperature and
# timeout_seconds, and NOTHING read any of them -- app/core/config.py says so
# in as many words. The LLM router is a process-wide singleton shared by every
# installation, so a per-repo model override would let one tenant drain
# another's quota tier.
#
# They are deployment settings, set by the operator:
#
#   LLM_PRIMARY_MODEL   LLM_FALLBACK_MODEL   LLM_GEMINI_MODEL
#
# Leaving them here was worse than omitting them: when the provider retired
# the models and every AI command started failing, this file is the first
# place someone would edit, and editing it would have done nothing.

confidence:
  thresholds:
    pr_title_rewrite: 0.85
    issue_label: 0.75
    auto_merge: 0.95
    fix_command: 0.70
    code_review: 0.75

notifications:
  slack: false
  discord: false
  on_secret_detected: true
  on_high_risk_pr: true
  on_health_degraded: true

labels:
  auto_create: true

commands:
  permissions:
    maintainer_only:
      - merge
      - release
      - rollback
      # Writes to persistent repo memory, which is injected into every later
      # AI prompt. Ungated, any commenter could poison that context.
      - ignore

  # `enabled` is an optional allow-list. Omitted here, which means every
  # command stays available — the registry is not duplicated into config,
  # because a copy goes stale and then silently disables working commands.
  #
  # To restrict, list only what you want:
  #
  # enabled:
  #   - fix
  #   - explain
  #   - health
