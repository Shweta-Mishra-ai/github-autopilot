# .github/workflows/keepalive.yml
# Two jobs in one:
#   1. Keep-alive, best effort — Render's free tier sleeps a service after
#      15 min idle, giving the next visitor a ~50 s cold start. This is
#      scheduled every 10 min, but GitHub runs schedules when it can: in
#      practice this ran every 2-7 hours (Oct 2026), so it does NOT keep the
#      instance warm. Use an external pinger on /ping for that.
#   2. Health check — if production stops answering, this workflow goes
#      red (badge in the README) and GitHub emails the repo owner.
# The retry loop below absorbs the cold start these runs usually meet.

name: Server Health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /ping
        run: |
          URL="https://github-autopilot-1.onrender.com/ping"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 75 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK (attempt ${attempt}): $(cat /tmp/body)"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code} — retrying in 20s (cold start takes ~50s)"
            sleep 20
          done
          echo "::error::Production /ping unhealthy after 3 attempts (last HTTP ${code})"
          exit 1
