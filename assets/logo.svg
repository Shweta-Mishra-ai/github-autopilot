<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="wing" x1="30" y1="80" x2="130" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <!-- rounded shield/badge -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#bg)"/>

  <!-- autopilot paper-plane / delta wing -->
  <path d="M80 34 L126 108 L80 92 L34 108 Z" fill="url(#wing)"/>
  <path d="M80 34 L80 92 L34 108 Z" fill="#FFFFFF" opacity="0.55"/>

  <!-- robot eye / status dot -->
  <circle cx="80" cy="64" r="9" fill="#0F172A"/>
  <circle cx="83" cy="61" r="3" fill="#FFFFFF"/>

  <!-- contrail dots -->
  <circle cx="80" cy="118" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="80" cy="131" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="80" cy="142" r="2" fill="#FFFFFF" opacity="0.35"/>
</svg>
