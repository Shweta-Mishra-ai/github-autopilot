[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# CI filters with `-m "not e2e and not integration"`. Registering them makes
# that filter checkable rather than a string that silently matches nothing:
# an unregistered marker is a typo pytest will not report, so `not integraton`
# would have quietly excluded zero tests forever.
#
# Nothing carries either marker today. They are the seam for tests that need a
# real Redis or a real GitHub App — those belong in their own job with the
# services attached, not in the unit matrix.
markers =
    integration: needs a real external service (Redis, GitHub API)
    e2e: drives the whole app end to end
