<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace">
  <style>
    .frame { fill: #0d1117; stroke: #30363d; }
    .bar   { fill: #161b22; }
    .t     { font-size: 14px; fill: #c9d1d9; }
    .dim   { fill: #8b949e; }
    .user  { fill: #58a6ff; font-weight: bold; }
    .bot   { fill: #a371f7; font-weight: bold; }
    .cmd   { fill: #7ee787; font-weight: bold; }
    .ok    { fill: #3fb950; }
    .warn  { fill: #d29922; }
    .step  { opacity: 0; animation: appear .01s linear forwards; }
    .s1 { animation-delay: .6s; }
    .s2 { animation-delay: 1.6s; }
    .s3 { animation-delay: 2.8s; }
    .s4 { animation-delay: 3.6s; }
    .s5 { animation-delay: 4.4s; }
    .s6 { animation-delay: 5.2s; }
    .s7 { animation-delay: 6.2s; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect class="frame" x="1" y="1" width="718" height="358" rx="10"/>
  <rect class="bar" x="1" y="1" width="718" height="34" rx="10"/>
  <rect class="bar" x="1" y="20" width="718" height="15"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="360" y="23" text-anchor="middle" class="t dim" font-size="12">github.com — issue #42 · login crashes on empty email</text>

  <!-- user comment -->
  <g class="step s1">
    <text x="24" y="66" class="t"><tspan class="user">@shweta</tspan><tspan class="dim"> commented</tspan></text>
    <text x="24" y="90" class="t"><tspan class="cmd">/fix</tspan><tspan> app/auth/login.py</tspan><tspan class="cursor">▌</tspan></text>
  </g>

  <!-- bot working -->
  <g class="step s2">
    <text x="24" y="126" class="t"><tspan class="bot">🤖 github-autopilot</tspan><tspan class="dim"> is working…</tspan></text>
  </g>
  <g class="step s3"><text x="40" y="150" class="t dim">⏳ webhook verified · queued · reading issue + code context</text></g>
  <g class="step s4"><text x="40" y="174" class="t dim">🧠 root cause analysis (Groq · llama-3.3-70b)</text></g>
  <g class="step s5"><text x="40" y="198" class="t dim">🛡️ confidence 0.91 ≥ threshold 0.75 · guardrails passed</text></g>

  <!-- bot reply -->
  <g class="step s6">
    <text x="24" y="234" class="t"><tspan class="bot">🤖 github-autopilot</tspan><tspan class="dim"> replied in 4.2s</tspan></text>
    <text x="40" y="258" class="t"><tspan class="ok">✔ Root cause:</tspan><tspan> email None → .strip() raises AttributeError (login.py:48)</tspan></text>
    <text x="40" y="282" class="t"><tspan class="ok">✔ Fix:</tspan><tspan> guard clause + early 400 response — diff posted below</tspan></text>
    <text x="40" y="306" class="t"><tspan class="ok">✔ Test:</tspan><tspan> test_login_rejects_empty_email() included</tspan></text>
  </g>
  <g class="step s7">
    <text x="24" y="338" class="t"><tspan class="warn">★</tspan><tspan class="dim"> also try: </tspan><tspan class="cmd">/security</tspan><tspan class="dim"> · </tspan><tspan class="cmd">/review</tspan><tspan class="dim"> · </tspan><tspan class="cmd">/autofix</tspan><tspan class="dim"> · </tspan><tspan class="cmd">/merge</tspan></text>
  </g>
</svg>
