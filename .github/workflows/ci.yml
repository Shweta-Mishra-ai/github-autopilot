# .github/workflows/ci.yml
# Tests + lint run on every push/PR to main and feature branches.
# Security: GITHUB_TOKEN scoped to read-only for all non-release jobs.

name: CI

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ hashFiles('requirements-dev.txt') }}

      - name: Install ruff
        run: pip install ruff==0.8.0

      - name: Lint check
        run: |
          ruff check app/ \
            --select E,F,W,B,C4,SIM \
            --ignore E501,B008 \
            --output-format=github

      - name: Format check
        run: ruff format --check app/

  # ── Tests (Python 3.10 / 3.11 / 3.12) ───────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Smoke test — verify all imports
        env:
          GITHUB_WEBHOOK_SECRET: "smoke-test-secret-32chars-long!!"
          GITHUB_APP_ID: "99999"
          GITHUB_PRIVATE_KEY: ""
          GROQ_API_KEY: "test_key_not_real"
          REDIS_URL: "redis://localhost:6379/0"
          MCP_API_KEY: "test-mcp-key"
        run: |
          python -c "
          import app.core.redis_client
          import app.core.webhook_security
          import app.core.idempotency
          import app.core.thread_pool
          import app.core.sanitizer
          import app.ai.circuit_breaker
          import app.ai.router
          import app.handlers.comments
          import app.handlers.autofix
          import app.intelligence.embeddings
          from app.github.client import GitHubError, GitHubSecondaryRateLimitError
          print('All imports OK')
          "

      - name: Run tests
        env:
          REDIS_URL: "redis://localhost:6379/0"
          GROQ_API_KEY: "test_key_not_real"
          GITHUB_APP_ID: "99999"
          GITHUB_PRIVATE_KEY: ""
          GITHUB_WEBHOOK_SECRET: "test-webhook-secret-32chars-abc!"
          METRICS_AUTH_TOKEN: "test_metrics_token"
          MCP_API_KEY: "test-mcp-api-key-xyz"
          LOG_FORMAT: "text"
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -m "not e2e and not integration" \
            -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2023-62

  # ── Test-count badge (main only) ─────────────────────────────────────────────
  # Publishes the real pytest pass count from THIS run to the `badges` branch.
  # README's "tests: N passing" badge reads that JSON via shields.io/endpoint,
  # so the number can never drift from an actual green CI run.
  badge:
    name: Publish test badge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Count passing tests
        env:
          GROQ_API_KEY: "test_key_not_real"
          GITHUB_APP_ID: "99999"
          GITHUB_PRIVATE_KEY: ""
          GITHUB_WEBHOOK_SECRET: "test-webhook-secret-32chars-abc!"
          METRICS_AUTH_TOKEN: "test_metrics_token"
          MCP_API_KEY: "test-mcp-api-key-xyz"
          LOG_FORMAT: "text"
        run: |
          pytest tests/ -q -m "not e2e and not integration" | tee pytest-out.txt
          COUNT=$(grep -oE '[0-9]+ passed' pytest-out.txt | grep -oE '[0-9]+')
          test -n "$COUNT"
          echo "PASS_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Push badge JSON to badges branch
        run: |
          mkdir /tmp/badges
          cat > /tmp/badges/tests.json <<EOF
          {"schemaVersion": 1, "label": "tests", "message": "${PASS_COUNT} passing", "color": "22c55e", "namedLogo": "pytest", "logoColor": "white"}
          EOF
          cd /tmp/badges
          git init -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json
          git commit -m "chore: update test-count badge from CI run ${GITHUB_RUN_ID}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Release (tag-triggered only) ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GitHub Autopilot ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            See the [README Changelog](https://github.com/${{ github.repository }}#changelog) for full details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
